name: Chat Sense Automation

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  IMGBBB_API_KEY: ${{ secrets.IMGBBB_API_KEY }}

permissions:
  contents: write

jobs:
  run-chat-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright playwright-stealth requests

      - name: Install Playwright and System Dependencies
        run: |
          python -m playwright install --with-deps chromium

      - name: Run Chat Sense Script with Virtual Display
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          xvfb-run --server-args="-screen 0 1280x1024x24" python chat_sense.py

      - name: Commit and Push Updated User Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git pull origin main
          
          git add -A
          
          if git diff --staged --quiet; then
            echo "No new changes or user_data updates to commit."
          else
            git commit -m "chore: automated chat session updates and user_data persistence [skip ci]"
            git push origin main
          fi